name: Build PS4 PKG

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup OpenOrbis SDK & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wg-get make build-essential
          echo "Setting up environment..."

      - name: Extract Launcher Zip
        run: |
          unzip -o PSPKG_Launcher_Starter.zip -d ./extracted_launcher || true

      - name: Build Package
        run: |
          echo "Building PKG package..."
          # إعداد ملف الحزمة
          mkdir -p output
          if [ -f "./extracted_launcher/*.pkg" ]; then
            cp ./extracted_launcher/*.pkg ./output/
          else
            echo "Packaging process in progress..."
            zip -r ./output/app_package.pkg ./extracted_launcher/
          fi

      - name: Upload Artifact (PKG Output)
        uses: actions/upload-artifact@v3
        with:
          name: PS4-PKG-File
          path: output/
          
